name: Build & Push Docker Images

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: danhaus93-ops

jobs:
  # ═══════════════════════════════════════════════════════════════════
  # API — build on native runners, one per arch, then merge manifest
  # ═══════════════════════════════════════════════════════════════════
  build-api:
    name: Build API (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./danhaus93-solostrike/api
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.OWNER }}/solostrike-api,push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-api-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-api:
    name: Merge API manifest
    runs-on: ubuntu-latest
    needs: build-api
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-api-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ env.OWNER }}/solostrike-api:latest \
            $(printf '${{ env.REGISTRY }}/${{ env.OWNER }}/solostrike-api@sha256:%s ' *)
      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.OWNER }}/solostrike-api:latest

  # ═══════════════════════════════════════════════════════════════════
  # UI — build on native runners, one per arch, then merge manifest
  # ═══════════════════════════════════════════════════════════════════
  build-ui:
    name: Build UI (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./danhaus93-solostrike/ui
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.OWNER }}/solostrike-ui,push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-ui-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-ui:
    name: Merge UI manifest
    runs-on: ubuntu-latest
    needs: build-ui
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-ui-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ env.OWNER }}/solostrike-ui:latest \
            $(printf '${{ env.REGISTRY }}/${{ env.OWNER }}/solostrike-ui@sha256:%s ' *)
      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.OWNER }}/solostrike-ui:latest

  # ═══════════════════════════════════════════════════════════════════
  # STUNNEL — TLS stratum terminator sidecar (v1.5.3+)
  # ═══════════════════════════════════════════════════════════════════
  build-stunnel:
    name: Build Stunnel (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./stunnel
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.OWNER }}/solostrike-stunnel,push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-stunnel-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-stunnel:
    name: Merge Stunnel manifest
    runs-on: ubuntu-latest
    needs: build-stunnel
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-stunnel-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ env.OWNER }}/solostrike-stunnel:latest \
            $(printf '${{ env.REGISTRY }}/${{ env.OWNER }}/solostrike-stunnel@sha256:%s ' *)
      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.OWNER }}/solostrike-stunnel:latest

  # ═══════════════════════════════════════════════════════════════════
  # PIN DIGESTS — auto-update docker-compose.yml with the newly-built
  # image digests so users updating via community-store always get
  # code + digest pins in lockstep. Runs only after all three image
  # builds succeed.
  #
  # Tag scheme:
  #   :latest — always the newest image (mutable, useful for development)
  #   :vX.Y.Z — immutable version label, derived from umbrel-app.yml
  #
  # docker-compose.yml format:
  #   image: ghcr.io/<owner>/<name>:vX.Y.Z@sha256:<digest>
  #
  # The :vX.Y.Z label is human-readable; the @sha256: digest is the
  # cryptographic contract. Docker pulls exactly those bytes regardless
  # of tag-pointer changes.
  #
  # Uses GITHUB_TOKEN, which intentionally does NOT trigger downstream
  # workflows on its auto-commits — prevents infinite CI loops.
  # ═══════════════════════════════════════════════════════════════════
  pin-digests:
    name: Pin docker-compose.yml to new digests
    runs-on: ubuntu-latest
    needs: [merge-api, merge-ui, merge-stunnel]
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Default GITHUB_TOKEN with write perms is fine for our commits.
          # We set fetch-depth: 0 because we may need to rebase if main
          # advanced during the build (e.g. user pushed another commit).
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version from umbrel-app.yml
        id: ver
        run: |
          # Parse `version: "X.Y.Z"` line. Quotes optional in YAML but
          # currently present in our file. Strip them either way.
          VERSION=$(grep -E '^version:' danhaus93-solostrike/umbrel-app.yml \
            | head -1 \
            | sed -E 's/^version:[[:space:]]*"?([^"]+)"?$/\1/')
          if [ -z "$VERSION" ]; then
            echo "::error::Failed to extract version from umbrel-app.yml"
            exit 1
          fi
          echo "Version detected: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Tag images with version
        id: tag
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          # Re-tag :latest as :vX.Y.Z so we have an immutable version label.
          # buildx imagetools create copies the manifest list (preserves
          # multi-arch) — no rebuild, just a re-label in the registry.
          for img in solostrike-api solostrike-ui solostrike-stunnel; do
            echo "Tagging $img:latest → $img:v$VERSION"
            docker buildx imagetools create \
              -t ${{ env.REGISTRY }}/${{ env.OWNER }}/$img:v$VERSION \
              ${{ env.REGISTRY }}/${{ env.OWNER }}/$img:latest
          done

      - name: Capture digests
        id: digests
        run: |
          # Inspect each image and capture its sha256 digest. We use the
          # :latest tag since we just confirmed it's the newest.
          # `imagetools inspect --raw` returns the manifest JSON. The
          # top-level manifest list's digest is what docker-compose will
          # pin to (Docker resolves it to the per-platform manifest at
          # pull time, which is the same behavior as :latest today).
          for img in solostrike-api solostrike-ui solostrike-stunnel; do
            # Get digest from manifest-list inspection.
            # buildx imagetools inspect prints "Name: ... Digest: sha256:..."
            DIGEST=$(docker buildx imagetools inspect \
              ${{ env.REGISTRY }}/${{ env.OWNER }}/$img:latest \
              | grep -E '^Digest:' \
              | head -1 \
              | awk '{print $2}')
            if [ -z "$DIGEST" ] || [[ "$DIGEST" != sha256:* ]]; then
              echo "::error::Failed to capture digest for $img (got: $DIGEST)"
              exit 1
            fi
            echo "$img digest: $DIGEST"
            # Map service name to env var (api/ui/stunnel)
            case "$img" in
              solostrike-api)     echo "api_digest=$DIGEST" >> $GITHUB_OUTPUT ;;
              solostrike-ui)      echo "ui_digest=$DIGEST" >> $GITHUB_OUTPUT ;;
              solostrike-stunnel) echo "stunnel_digest=$DIGEST" >> $GITHUB_OUTPUT ;;
            esac
          done

      - name: Update docker-compose.yml
        id: rewrite
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          API_DIGEST="${{ steps.digests.outputs.api_digest }}"
          UI_DIGEST="${{ steps.digests.outputs.ui_digest }}"
          STUNNEL_DIGEST="${{ steps.digests.outputs.stunnel_digest }}"
          FILE=danhaus93-solostrike/docker-compose.yml

          # Snapshot before so we can detect no-op.
          cp "$FILE" "$FILE.before"

          # Replace each service's image line with the pinned form.
          # The pattern matches:
          #   image: ghcr.io/danhaus93-ops/solostrike-NAME:<anything>
          # And replaces with:
          #   image: ghcr.io/danhaus93-ops/solostrike-NAME:vVERSION@DIGEST
          # We use sed with extended regex. Each image gets one replacement.
          sed -i -E \
            "s|image: ghcr\\.io/danhaus93-ops/solostrike-api:.*|image: ghcr.io/danhaus93-ops/solostrike-api:v$VERSION@$API_DIGEST|" \
            "$FILE"
          sed -i -E \
            "s|image: ghcr\\.io/danhaus93-ops/solostrike-ui:.*|image: ghcr.io/danhaus93-ops/solostrike-ui:v$VERSION@$UI_DIGEST|" \
            "$FILE"
          sed -i -E \
            "s|image: ghcr\\.io/danhaus93-ops/solostrike-stunnel:.*|image: ghcr.io/danhaus93-ops/solostrike-stunnel:v$VERSION@$STUNNEL_DIGEST|" \
            "$FILE"

          # Sanity check — confirm all 3 images now have @sha256: pins.
          PINNED=$(grep -cE "image: ghcr\\.io/danhaus93-ops/solostrike-.*@sha256:" "$FILE" || true)
          if [ "$PINNED" -ne 3 ]; then
            echo "::error::Expected 3 pinned images in docker-compose.yml, found $PINNED"
            diff "$FILE.before" "$FILE" || true
            exit 1
          fi

          # Detect no-op (digests haven't changed — same build twice).
          if diff -q "$FILE.before" "$FILE" > /dev/null; then
            echo "No digest changes — skipping commit"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "--- diff ---"
            diff "$FILE.before" "$FILE" || true
          fi

          rm "$FILE.before"

      - name: Commit and push pin update
        if: steps.rewrite.outputs.changed == 'true'
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add danhaus93-solostrike/docker-compose.yml
          # [skip ci] in the message is belt-and-suspenders — GITHUB_TOKEN
          # auto-commits already don't re-trigger workflows, but the marker
          # makes intent obvious if anyone reads git log.
          git commit -m "[CI] pin docker-compose.yml to v$VERSION digests [skip ci]"

          # Race-condition handling: if main advanced during our build
          # (someone else pushed), rebase and retry up to 3 times.
          for attempt in 1 2 3; do
            if git push origin HEAD:${GITHUB_REF#refs/heads/}; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            echo "Push failed (attempt $attempt) — rebasing"
            git fetch origin
            git rebase origin/${GITHUB_REF#refs/heads/} || {
              echo "::error::Rebase failed — manual intervention required"
              exit 1
            }
          done
          echo "::error::Push failed after 3 attempts"
          exit 1

name: Build & Push Docker Images

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - 'docs/**'
      - '.github/**'
  workflow_dispatch:

# Serialize workflow runs per branch to prevent concurrent pin-digests jobs
# from racing each other on docker-compose.yml. Each run completes (including
# the bot's auto-commit) before the next starts. cancel-in-progress: false
# means queued runs wait, they don't overwrite each other.
concurrency:
  group: build-and-pin-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  OWNER: danhaus93-ops

jobs:
  # ═══════════════════════════════════════════════════════════════════
  # API — build on native runners, one per arch, then merge manifest
  # ═══════════════════════════════════════════════════════════════════
  build-api:
    name: Build API (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./danhaus93-solostrike/api
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.OWNER }}/solostrike-api,push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-api-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-api:
    name: Merge API manifest
    runs-on: ubuntu-latest
    needs: build-api
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-api-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ env.OWNER }}/solostrike-api:latest \
            $(printf '${{ env.REGISTRY }}/${{ env.OWNER }}/solostrike-api@sha256:%s ' *)
      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.OWNER }}/solostrike-api:latest

  # ═══════════════════════════════════════════════════════════════════
  # UI — build on native runners, one per arch, then merge manifest
  # ═══════════════════════════════════════════════════════════════════
  build-ui:
    name: Build UI (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./danhaus93-solostrike/ui
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.OWNER }}/solostrike-ui,push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-ui-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-ui:
    name: Merge UI manifest
    runs-on: ubuntu-latest
    needs: build-ui
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-ui-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ env.OWNER }}/solostrike-ui:latest \
            $(printf '${{ env.REGISTRY }}/${{ env.OWNER }}/solostrike-ui@sha256:%s ' *)
      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.OWNER }}/solostrike-ui:latest

  # ═══════════════════════════════════════════════════════════════════
  # STUNNEL — TLS stratum terminator sidecar (v1.5.3+)
  # ═══════════════════════════════════════════════════════════════════
  build-stunnel:
    name: Build Stunnel (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./stunnel
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.OWNER }}/solostrike-stunnel,push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-stunnel-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-stunnel:
    name: Merge Stunnel manifest
    runs-on: ubuntu-latest
    needs: build-stunnel
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-stunnel-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ env.OWNER }}/solostrike-stunnel:latest \
            $(printf '${{ env.REGISTRY }}/${{ env.OWNER }}/solostrike-stunnel@sha256:%s ' *)
      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.OWNER }}/solostrike-stunnel:latest


  # ═══════════════════════════════════════════════════════════════════
  # PIN DIGESTS — auto-update docker-compose.yml with the newly-built
  # image digests after every release.
  #
  # CRITICAL: the GITHUB_TOKEN can push images by DIGEST and to :latest,
  # but FAILS to create new VERSION TAGS (:v1.11.x) on personal-account
  # packages with this error:
  #   denied: installation not allowed to Write organization package
  # Despite the misleading word "organization", this fires for personal
  # accounts too. It's the GITHUB_TOKEN's installation context limitation.
  #
  # SOLUTION: write a PAT (GHCR_WRITE_TOKEN secret) directly into
  # ~/.docker/config.json BEFORE invoking imagetools. docker/login-action
  # writes to a sandboxed config path that imagetools doesn't read, so
  # we manually populate the default config. This is the proven approach
  # for "buildx imagetools create" + GHCR + tag-creation scenarios.
  # ═══════════════════════════════════════════════════════════════════
  pin-digests:
    name: Pin docker-compose.yml to new digests
    runs-on: ubuntu-latest
    needs: [merge-api, merge-ui, merge-stunnel]
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Docker auth (PAT for ghcr.io)
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_WRITE_TOKEN }}
        run: |
          # Write PAT directly into ~/.docker/config.json. imagetools reads
          # from this file regardless of what docker/login-action did with
          # its sandboxed config dir. This is what GitHub Actions community
          # ultimately landed on as the workaround for the tag-create issue.
          if [ -z "$GHCR_TOKEN" ]; then
            echo "::error::GHCR_WRITE_TOKEN secret is not set. Add it under repo Settings → Secrets and variables → Actions."
            exit 1
          fi
          mkdir -p ~/.docker
          AUTH=$(printf "%s:%s" "${{ github.actor }}" "$GHCR_TOKEN" | base64 -w0)
          cat > ~/.docker/config.json <<JSON
          {
            "auths": {
              "ghcr.io": {
                "auth": "$AUTH"
              }
            }
          }
          JSON
          echo "Docker config written. ghcr.io will be authenticated as ${{ github.actor }} via PAT."

      - name: Read version from umbrel-app.yml
        id: ver
        run: |
          VERSION=$(grep -E '^version:' danhaus93-solostrike/umbrel-app.yml \
            | head -1 \
            | sed -E 's/^version:[[:space:]]*"?([^"]+)"?$/\1/')
          if [ -z "$VERSION" ]; then
            echo "::error::Failed to extract version from umbrel-app.yml"
            exit 1
          fi
          echo "Version detected: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Tag images with version
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          for img in solostrike-api solostrike-ui solostrike-stunnel; do
            echo "Tagging $img:latest → $img:v$VERSION"
            docker buildx imagetools create \
              -t ${{ env.REGISTRY }}/${{ env.OWNER }}/$img:v$VERSION \
              ${{ env.REGISTRY }}/${{ env.OWNER }}/$img:latest
          done

      - name: Capture digests
        id: digests
        run: |
          for img in solostrike-api solostrike-ui solostrike-stunnel; do
            DIGEST=$(docker buildx imagetools inspect \
              ${{ env.REGISTRY }}/${{ env.OWNER }}/$img:latest \
              | grep -E '^Digest:' \
              | head -1 \
              | awk '{print $2}')
            if [ -z "$DIGEST" ] || [[ "$DIGEST" != sha256:* ]]; then
              echo "::error::Failed to capture digest for $img (got: $DIGEST)"
              exit 1
            fi
            echo "$img digest: $DIGEST"
            case "$img" in
              solostrike-api)     echo "api_digest=$DIGEST" >> $GITHUB_OUTPUT ;;
              solostrike-ui)      echo "ui_digest=$DIGEST" >> $GITHUB_OUTPUT ;;
              solostrike-stunnel) echo "stunnel_digest=$DIGEST" >> $GITHUB_OUTPUT ;;
            esac
          done

      - name: Update docker-compose.yml
        id: rewrite
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          API_DIGEST="${{ steps.digests.outputs.api_digest }}"
          UI_DIGEST="${{ steps.digests.outputs.ui_digest }}"
          STUNNEL_DIGEST="${{ steps.digests.outputs.stunnel_digest }}"
          FILE=danhaus93-solostrike/docker-compose.yml

          cp "$FILE" "$FILE.before"

          sed -i -E \
            "s|image: ghcr\.io/danhaus93-ops/solostrike-api:.*|image: ghcr.io/danhaus93-ops/solostrike-api:v$VERSION@$API_DIGEST|" \
            "$FILE"
          sed -i -E \
            "s|image: ghcr\.io/danhaus93-ops/solostrike-ui:.*|image: ghcr.io/danhaus93-ops/solostrike-ui:v$VERSION@$UI_DIGEST|" \
            "$FILE"
          sed -i -E \
            "s|image: ghcr\.io/danhaus93-ops/solostrike-stunnel:.*|image: ghcr.io/danhaus93-ops/solostrike-stunnel:v$VERSION@$STUNNEL_DIGEST|" \
            "$FILE"

          PINNED=$(grep -cE "image: ghcr\.io/danhaus93-ops/solostrike-.*@sha256:" "$FILE" || true)
          if [ "$PINNED" -ne 3 ]; then
            echo "::error::Expected 3 pinned images in docker-compose.yml, found $PINNED"
            diff "$FILE.before" "$FILE" || true
            exit 1
          fi

          if diff -q "$FILE.before" "$FILE" > /dev/null; then
            echo "No digest changes — skipping commit"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "--- diff ---"
            diff "$FILE.before" "$FILE" || true
          fi

          rm "$FILE.before"

      - name: Commit and push pin update
        if: steps.rewrite.outputs.changed == 'true'
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add danhaus93-solostrike/docker-compose.yml
          git commit -m "[CI] pin docker-compose.yml to v$VERSION digests [skip ci]"

          for attempt in 1 2 3; do
            if git push origin HEAD:${GITHUB_REF#refs/heads/}; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            echo "Push failed (attempt $attempt) — rebasing"
            git fetch origin
            git rebase origin/${GITHUB_REF#refs/heads/} || {
              echo "::error::Rebase failed — manual intervention required"
              exit 1
            }
          done
          echo "::error::Push failed after 3 attempts"
          exit 1

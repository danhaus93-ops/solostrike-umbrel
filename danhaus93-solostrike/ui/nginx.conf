server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- Compression ---------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/javascript text/xml text/csv
        application/javascript application/json application/xml
        application/xml+rss image/svg+xml;

    # --- Security headers ----------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "no-referrer" always;

    # --- REST API proxy ------------------------------------------------------
    # v1.11.13: use full container name instead of bare 'api' alias. Umbrel's
    # umbrel_main_network is shared across all apps, and the bare 'api' alias
    # collides with other apps (e.g. mempool_api_1) registering the same
    # alias. Docker DNS round-robins between them, causing intermittent 502s.
    # The full container name danhaus93-solostrike_api_1 is unique on the
    # shared network and resolves deterministically to our API container.
    location /api/ {
        proxy_pass         http://danhaus93-solostrike_api_1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # --- WebSocket proxy (long-lived, needs generous timeouts) --------------
    # UI connects to /api/ws (see WS_URL in App.jsx)
    # v1.11.13: see comment on REST API location above for why we use the
    # full container name instead of the 'api' alias.
    location /api/ws {
        proxy_pass         http://danhaus93-solostrike_api_1:3001/api/ws;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade            $http_upgrade;
        proxy_set_header   Connection         "Upgrade";
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- Static assets: aggressive cache, hashed filenames are immutable ----
    location ~* \.(?:js|mjs|css|woff2?|ttf|eot|svg|png|jpe?g|gif|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # --- SPA fallback: everything else -> index.html ----------------------
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
